<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The American Girl Paper Dolls</title>
<style>
  :root {
    --cream: #FBF6EB;
    --cream-deep: #F1E6CC;
    --crimson: #A6192E;
    --crimson-deep: #7C0C1F;
    --ink: #4A2C20;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: radial-gradient(120% 120% at 50% 0%, #FFFDF7 0%, var(--cream) 45%, var(--cream-deep) 100%);
    font-family: 'Hoefler Text', Georgia, serif;
    color: var(--ink);
  }
  header.bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 22px; background: var(--crimson); color: var(--cream);
    box-shadow: 0 2px 14px rgba(124,12,31,0.22);
    /* Sit above the app's injected 36px window-drag strip (z-index
       2147483646) so the header buttons receive clicks. Without this
       the drag overlay eats every click on Download/Back/Gallery. */
    position: sticky; top: 0; z-index: 2147483647;
  }
  header.bar h1 {
    margin: 0; font-style: italic; font-weight: 400; font-size: 21px; letter-spacing: .4px;
  }
  header.bar .actions { display: flex; gap: 8px; }
  .btn {
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600;
    padding: 8px 15px; border-radius: 999px; border: 1px solid transparent;
    cursor: pointer; text-decoration: none; transition: all .15s;
    background: rgba(255,246,235,.16); color: var(--cream);
  }
  .btn:hover { background: rgba(255,246,235,.3); }
  .btn.ghost { background: transparent; border-color: rgba(255,246,235,.4); }
  .btn.solid { background: var(--cream); color: var(--crimson-deep); }
  .btn.solid:hover { filter: brightness(1.04); }

  /* ---------- Character picker ---------- */
  #picker { padding: 36px 22px 60px; text-align: center; }
  #picker .eyebrow {
    font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: .22em;
    text-transform: uppercase; color: var(--crimson-deep); opacity: .8; margin: 0 0 6px;
  }
  #picker h2 { margin: 0 0 28px; font-style: italic; font-weight: 400; font-size: 30px; color: var(--crimson-deep); }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px;
    max-width: 760px; margin: 0 auto;
  }
  @media (max-width: 640px){ .grid { grid-template-columns: repeat(2,1fr); } }
  .doll-card {
    background: #FFFCF4; border: 1px solid rgba(124,12,31,.18); border-radius: 14px;
    padding: 14px 10px 16px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(124,12,31,.08);
    transition: transform .16s, box-shadow .16s;
  }
  .doll-card:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(124,12,31,.18); }
  .doll-card img { width: 100%; height: 150px; object-fit: contain; }
  .doll-card .name { margin-top: 8px; font-weight: 600; color: var(--crimson-deep); font-size: 15px; }
  .doll-card .year { font-family: -apple-system, sans-serif; font-size: 11px; color: #8c6a5c; letter-spacing: .08em; }

  /* ---------- Dress-up stage ---------- */
  #dressup { display: none; padding: 24px; }
  #dressup.active { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .stage-wrap { display: flex; flex-direction: column; align-items: center; }
  .stage {
    position: relative; width: 320px; height: 420px;
    background: linear-gradient(160deg,#FFFFFF 0%, #FBF1DF 100%);
    border: 1px solid rgba(124,12,31,.18); border-radius: 14px;
    box-shadow: 0 10px 34px rgba(124,12,31,.16); overflow: hidden;
  }
  .stage .layer { position: absolute; pointer-events: none; }
  .stage .layer.hidden { display: none; }
  .closet { width: 320px; }
  .closet h3 {
    margin: 0 0 12px; font-style: italic; font-weight: 400; color: var(--crimson-deep);
    font-size: 20px; border-bottom: 1px solid rgba(124,12,31,.16); padding-bottom: 8px;
  }
  .closet .navgroup { margin-bottom: 18px; }
  .closet .navlabel {
    font-family: -apple-system, sans-serif; font-size: 10.5px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--crimson-deep); font-weight: 600; margin-bottom: 7px;
  }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb {
    width: 64px; height: 64px; border-radius: 10px; cursor: pointer;
    background: #FFFCF4 center/contain no-repeat; border: 2px solid rgba(124,12,31,.18);
    transition: all .14s; display: flex; align-items: flex-end; justify-content: center;
  }
  .thumb:hover { border-color: var(--crimson); transform: translateY(-2px); }
  .thumb.on { border-color: var(--crimson); background-color: #FBE3E8; box-shadow: 0 0 0 2px rgba(166,25,46,.25) inset; }
  .empty-note { color:#8c6a5c; font-size:12.5px; font-family:-apple-system,sans-serif; }
</style>
</head>
<body>
<header class="bar">
  <h1 id="title">The American Girl Paper Dolls</h1>
  <div class="actions">
    <a class="btn ghost" id="back-btn" href="#" style="display:none">‹ Choose another doll</a>
    <!-- Authentic print behavior: the 2008 game's congrats screen opened
         the character's outfit-template PDF (congrats.swf took a pdfurl
         param; howto.xml: "you'll be able to print out that outfit" —
         "designed to fit the American Girls Collection® paper dolls").
         It never printed your custom dress-up state. -->
    <a class="btn solid" id="print-btn" href="#" target="_blank" style="display:none">Print this outfit (PDF)</a>
    <a class="btn" href="agd://dashboard/games.html">Gallery</a>
  </div>
</header>

<section id="picker">
  <p class="eyebrow">A faithful offline rebuild</p>
  <h2>Choose a doll to dress</h2>
  <div class="grid" id="doll-grid"></div>
</section>

<section id="dressup">
  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
  </div>
  <div class="closet" id="closet"></div>
</section>

    },
    {
     "id": "shoes",
     "png": "Samantha__shoes.png",
     "nav": "shoes",
     "x": 25.0,
     "y": 319.0,

    },
    {

     "nav": "accessory",

    },
    {

    },

<script>
(function () {
  "use strict";
  var BASE = "agd://runtime/paperdoll/";
  var YEARS = {};
  var dolls = [];

  var PRETTY = {
    Addy: "Addy Walker", Felicity: "Felicity Merriman", Josefina: "Josefina Montoya",
    Kaya: "Kaya", Kirsten: "Kirsten Larson", Kit: "Kit Kittredge",
    Molly: "Molly McIntire", Samantha: "Samantha Parkington"
  };

  function renderPicker() {
    var grid = document.getElementById("doll-grid");
    grid.innerHTML = "";
    dolls.forEach(function (d) {
      var card = document.createElement("div");
      card.className = "doll-card";
      // The original Flash select screen's character portraits ship in the
      // mirror itself: doll_outfits/<Character>/icon.jpg. Use those rather
      // than a runtime icons/ dir that never existed.
      card.innerHTML =
        '<img src="agd://www.americangirl.com/agcn/paperdoll/doll_outfits/' +
            d.id + '/icon.jpg" alt="' + d.id + '">' +
        '<div class="name">' + (PRETTY[d.id] || d.id) + '</div>' +
        '<div class="year">' + (d.year ? "c. " + d.year : "") + '</div>';
      card.addEventListener("click", function () { openDoll(d); });
      grid.appendChild(card);
    });
  }

  function openDoll(d) {
    document.getElementById("picker").style.display = "none";
    var du = document.getElementById("dressup");
    du.classList.add("active");
    document.getElementById("back-btn").style.display = "";
    document.getElementById("title").textContent =
      (PRETTY[d.id] || d.id) + " — Paper Doll";

    // Printable PDF (recovered to /agcn/paperdoll/pdfs/<id>.pdf)
    var pb = document.getElementById("print-btn");
    pb.style.display = "";
    pb.href = "agd://www.americangirl.com/agcn/paperdoll/pdfs/" + d.id + ".pdf";

    // Compute a layout offset so the doll sits centered in the 320x420 stage.
    // doll.xml coords are relative to the original stage; normalize by the
    // base doll layer's box.
    var baseLayer = d.layers.find(function (l) { return l.id === "doll"; }) || d.layers[0];
    var offX = 160 - (baseLayer.x + baseLayer.w / 2);
    var offY = 400 - (baseLayer.y + baseLayer.h);

    // levelplus relationships from the original doll.xml: showing a
    // garment also shows its companion overlay (dress → arms — the arm
    // sprite drawn OVER the dress sleeves). Plus-target layers are never
    // shown on their own: the base doll art already includes arms, so an
    // unconditional arms overlay reads as a double-arm glitch on the
    // undressed doll.
    var plusTargets = {};
    d.layers.forEach(function (l) {
      if (l.plus) plusTargets[l.plus] = true;
    });
    function isInitiallyVisible(l) {
      if (l.nav !== "none") return false;           // garments start off
      if (!plusTargets[l.id]) return true;          // plain base art
      // plus-target: visible only if some initially-visible layer pluses
      // it (doll → underwear). Garment-owned overlays start hidden.
      return d.layers.some(function (o) {
        return o.plus === l.id && o.nav === "none" && !plusTargets[o.id];
      });
    }

    // Render layers
    var stage = document.getElementById("stage");
    stage.innerHTML = "";
    var sorted = d.layers.slice().sort(function (a, b) { return a.z - b.z; });
    sorted.forEach(function (l) {
      var img = document.createElement("img");
      img.className = "layer" + (isInitiallyVisible(l) ? "" : " hidden");
      img.src = BASE + "pieces/" + l.png;
      img.style.left = (l.x + offX) + "px";
      img.style.top = (l.y + offY) + "px";
      img.style.width = l.w + "px";
      img.style.zIndex = l.z;
      img.dataset.layerId = l.id;
      stage.appendChild(img);
    });

    // Re-derive every plus-target's visibility from its owners' current
    // state. Called after each closet toggle.
    function syncPlusLayers() {
      Object.keys(plusTargets).forEach(function (tid) {
        var el = stage.querySelector('[data-layer-id="' + tid + '"]');
        if (!el) return;  // piece not recovered (yet) — no-op
        var shown = d.layers.some(function (o) {
          if (o.plus !== tid) return false;
          if (o.nav === "none" && !plusTargets[o.id]) return true;  // base art
          var oEl = stage.querySelector('[data-layer-id="' + o.id + '"]');
          return oEl && !oEl.classList.contains("hidden");
        });
        el.classList.toggle("hidden", !shown);
      });
    }

    // Build closet (toggle buttons grouped by nav type)
    var closet = document.getElementById("closet");
    closet.innerHTML = "<h3>Dress " + (PRETTY[d.id] || d.id).split(" ")[0] + "</h3>";
    var NAV_LABELS = {
      stockings: "Stockings", shoes: "Shoes", dress: "Dress",
      hats: "Hats", accessory: "Accessories"
    };
    var groups = {};
    d.layers.forEach(function (l) {
      if (l.nav === "none") return;
      (groups[l.nav] = groups[l.nav] || []).push(l);
    });
    var order = ["dress", "hats", "stockings", "shoes", "accessory"];
    order.forEach(function (nav) {
      if (!groups[nav]) return;
      var g = document.createElement("div");
      g.className = "navgroup";
      g.innerHTML = '<div class="navlabel">' + (NAV_LABELS[nav] || nav) + '</div>';
      var thumbs = document.createElement("div");
      thumbs.className = "thumbs";
      groups[nav].forEach(function (l) {
        var t = document.createElement("div");
        t.className = "thumb";
        t.style.backgroundImage = "url('" + BASE + "pieces/" + l.png + "')";
        t.title = l.id;
        t.addEventListener("click", function () {
          var layerEl = stage.querySelector('[data-layer-id="' + l.id + '"]');
          if (!layerEl) return;
          var nowHidden = layerEl.classList.toggle("hidden");
          t.classList.toggle("on", !nowHidden);
          syncPlusLayers();
        });
        thumbs.appendChild(t);
      });
      g.appendChild(thumbs);
      closet.appendChild(g);
    });
  }

  document.getElementById("back-btn").addEventListener("click", function (e) {
    e.preventDefault();
    document.getElementById("dressup").classList.remove("active");
    document.getElementById("picker").style.display = "";
    document.getElementById("back-btn").style.display = "none";
    document.getElementById("print-btn").style.display = "none";
    document.getElementById("title").textContent = "The American Girl Paper Dolls";
  });

  // ---- bootstrap (runs last, after PRETTY + all functions are defined) ----
  // The manifest is injected as window.__AGD_PAPERDOLL_MANIFEST__ in a
  // <script> just before this one (avoids fetch() on the agd:// scheme,
  // which WebKit blocks).
  dolls = (window.__AGD_PAPERDOLL_MANIFEST__ || {}).dolls || [];
  if (dolls.length) {
    renderPicker();
  } else {
    document.getElementById("doll-grid").innerHTML =
      '<p class="empty-note">Paper dolls manifest missing.</p>';
  }
})();
</script>
</body>
</html>
