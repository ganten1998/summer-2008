<body class="popup" onunload="GUnload()">

<div id="logoTitle"><a name="top"></a><img src="../images/agLogoPopup.gif" width="165" height="50" /><p>Map and Driving Directions</p></div>
<div id="popupContent">
	<div id="windowUtils"><a href="#" onclick="window.print();return false;">Print</a> | <a href="" onClick="window.close();">Close Window</a></div>
	<h2>Atlanta</h2>
	<div id="map"></div>
	<div id="side_bar"></div>
	<div id="mapControl">
		<div id="mapControlDriving">
			<h1>Driving Directions</h1>
			<form onsubmit="return false;">
				<label for="startAddress">Starting Address:</label> <br />
				<input type="text" id="startAddress" onkeypress="checkEnter(this.form,event)"/><br/>
				<input class="btn" type="image" src="../images/display_directions.gif" value="Display Directions" onclick="displayDirections(this.form)"/>
			</form>
		</div>
<!--
		<div id="mapControlParking"><h1> Hotel Locations</h1>
			<input type="checkbox" id="hotelbox" onclick="boxclick(this,'hotel')" /> <img src="/stores/images/mm_20_green.png" width="10" height="16" /> <strong>Show Hotels</strong> Ask about special packages and rates for American Girl Boutique and Bistro visitors. (Rates are subject to change, and blackout dates do apply.) Don't forget to inquire about a bed for your doll. 
		</div>
-->
	</div>
	<div id="directions"></div>
</div>
	    

    <script type="text/javascript">
    //<![CDATA[

    if (GBrowserIsCompatible()) {
      var gmarkers = [];
      var gicons = [];
	  var side_bar_html = "";
      var gmarkers = [];
      var htmls = [];
      var i = 0;
      // arrays to hold variants of the info window html with get direction forms open
      var to_htmls = [];
	  var mylabel = {"url":"overlay.png",
                 "anchor":new GPoint(4,4),
                 "size":new GSize(12,12)};
				 
      var from_htmls = [];

      gicons["hotel"] = new GIcon(G_DEFAULT_ICON);
	  	gicons["hotel"].image = "/stores/images/mm_20_green.png";
		gicons["hotel"].iconSize = new GSize(12, 20);
		gicons["hotel"].shadowSize = new GSize(12, 20);
		gicons["hotel"].iconAnchor = new GPoint(10, 34);
		gicons["hotel"].infoWindowAnchor = new GPoint(10, 7);
      gicons["parking"] = new GIcon(G_DEFAULT_ICON,"/stores/images/mm_20_blue.png");
		gicons["parking"].iconSize = new GSize(12, 20);
		gicons["parking"].shadowSize = new GSize(12, 20);
		gicons["parking"].iconAnchor = new GPoint(7, 34);
		gicons["parking"].infoWindowAnchor = new GPoint(5, 2);
      gicons["info"] = new GIcon(G_DEFAULT_ICON,"/stores/images/mm_20_green.png");
		
      // A function to create the marker and set up the event window
      function createMarker(point,name,html,category) {
        var marker = new GMarker(point,gicons[category]);
        // The info window version with the "to here" form open
        to_htmls[i] = html + '<br>Directions: <b>To here</b> - <a href="javascript:fromhere(' + i + ')">From here</a>' +
           '<br>Start address:<form action="javascript:getDirections()">' +
           '<input type="text" SIZE=40 MAXLENGTH=40 name="saddr" id="saddr" value="" /><br>' +
           '<INPUT value="Get Directions" TYPE="SUBMIT">' +
           '<input type="hidden" id="daddr" value="'+name+"@"+ point.lat() + ',' + point.lng() + 
           '"/>';
        // The info window version with the "to here" form open
        from_htmls[i] = html + '<br>Directions: <a href="javascript:tohere(' + i + ')">To here</a> - <b>From here</b>' +
           '<br>End address:<form action="javascript:getDirections()">' +
           '<input type="text" SIZE=40 MAXLENGTH=40 name="daddr" id="daddr" value="" /><br>' +
           '<INPUT value="Get Directions" TYPE="SUBMIT">' +
           '<input type="hidden" id="saddr" value="'+name+"@"+ point.lat() + ',' + point.lng() +
           '"/>';
        // The inactive version of the direction info
        html = html + '<br>Directions: <a href="javascript:tohere('+i+')">To here</a> - <a href="javascript:fromhere('+i+')">From here</a>';
        
		// === Store the category and name info as a marker properties ===
         // save the info we need to use later for the side_bar
        gmarkers[i] = marker;
        htmls[i] = html;
        // add a line to the side_bar html
        side_bar_html += '<a href="javascript:myclick(' + i + ')">' + name + '</a><br>';
        i++;
		marker.mycategory = category;                                 
        marker.myname = name;
        GEvent.addListener(marker, "click", function() {
          marker.openInfoWindowHtml(html);
        });
        gmarkers.push(marker);
        return marker;
      }
	  

      // == shows all markers of a particular category, and ensures the checkbox is checked ==
      function show(category) {
        for (var i=0; i<gmarkers.length; i++) {
          if (gmarkers[i].mycategory == category) {
            gmarkers[i].show();
          }
        }
        // == check the checkbox ==
        document.getElementById(category+"box").checked = true;
      }

      // == hides all markers of a particular category, and ensures the checkbox is cleared ==
      function hide(category) {
        for (var i=0; i<gmarkers.length; i++) {
          if (gmarkers[i].mycategory == category) {
            gmarkers[i].hide();
          }
        }
        // == clear the checkbox ==
        document.getElementById(category+"box").checked = false;
        // == close the info window, in case its open on a marker that we just hid
        map.closeInfoWindow();
		AG.openInfoWindowHtml(html);
      }

      // == a checkbox has been clicked ==
      function boxclick(box,category) {
        if (box.checked) {
          show(category);
        } else {
          hide(category);
        }
        // == rebuild the side bar
        makeSidebar(category);
      }

      function myclick(i) {
        GEvent.trigger(gmarkers[i],"click");
      }
	  
      // ===== request the directions =====
      function getDirections() {
        var saddr = document.getElementById("saddr").value
        var daddr = document.getElementById("daddr").value
        gdir.load("from: "+saddr+" to: "+daddr);
      }


      // This function picks up the click and opens the corresponding info window
      function myclick(i) {
        gmarkers[i].openInfoWindowHtml(htmls[i]);
      }

      // functions that open the directions forms
      function tohere(i) {
        gmarkers[i].openInfoWindowHtml(to_htmls[i]);
      }
      function fromhere(i) {
        gmarkers[i].openInfoWindowHtml(from_htmls[i]);
      }

      // == rebuilds the sidebar to match the markers currently displayed ==
      function makeSidebar(category) {
        var html = "<ul>"
		for (var i=0; i<gmarkers.length; i++) {
          if (gmarkers[i].mycategory == category) {
           html  = "<h2>Hotels</h2><ul>";
          }
        }
        for (var i=0; i<gmarkers.length; i++) {
          if (!gmarkers[i].isHidden()) {
            html += '<li><a href="javascript:myclick(' + i + ')">' + gmarkers[i].myname + '</a></li>';
          }
        }
		html = html + "</ul>"
        document.getElementById("side_bar").innerHTML = html;
      }

     
	  
      // Read the data
      GDownloadUrl("mapdata_atl.xml", function(doc) {
        var xmlDoc = GXml.parse(doc);
        var markers = xmlDoc.documentElement.getElementsByTagName("marker");
          
        for (var i = 0; i < markers.length; i++) {
          // obtain the attribues of each marker
          var lat = parseFloat(markers[i].getAttribute("lat"));
          var lng = parseFloat(markers[i].getAttribute("lng"));
          var point = new GLatLng(lat,lng);
          var address = markers[i].getAttribute("address");
          var name = markers[i].getAttribute("name");
          var html = "<b>"+name+"</b><p>"+address;
          var category = markers[i].getAttribute("category");
          // create the marker
          var marker = createMarker(point,name,html,category);
          map.addOverlay(marker);
        }

        // == show or hide the categories initially ==
        hide("hotel");
        hide("parking");
        // == create the initial sidebar ==
        makeSidebar();
      });
	  
	  
	  var driving = new GDirections()
      function displayDirections(form){
        panel = document.getElementById("directions")
        var query = "from: " + form.startAddress.value + " to: 1202 North Point Circle, Alpharetta, GA 30022"
        AG.closeInfoWindow()
        panel.innerHTML = ""
        driving.clear()
        driving = new GDirections(map,panel);
        driving.load(query,"getPolyline")
        setTimeout('checkDirections(panel)',1000)
      }
       // create the map
      var map = new GMap2(document.getElementById("map"));
	  map.addControl(new GSmallMapControl());
      map.setCenter(new GLatLng(34.048704,-84.298418), 13);
	  AG = new GMarker(new GLatLng(34.048704,-84.298418));
	        // === create a GDirections Object ===
      var gdir=new GDirections(map, document.getElementById("directions"));
	  var html = "<div class='bubble'><h3>American Girl<br/> Boutique and Bistro</h3><div style='float:right'></div>North Point Mall<br/>1202 North Point Circle<br/>Alpharetta, GA 30022<br/>1-888-777-0010</div>"
	  GEvent.addListener(AG, 'click', function() {
		AG.openInfoWindowHtml(html);
	  });
	  map.addOverlay(AG);
	  map.addControl(new GSmallMapControl());
	  AG.openInfoWindowHtml(html);
	  
      function checkDirections(panel){
      	if(panel.innerHTML == ""){
        	panel.innerHTML = "Sorry, we were unable to find driving directions from this address. Please try again."
        }
      }
      
      function checkEnter(form,e){
          var key;
          if(window.event) key = window.event.keyCode;
          else key = e.which;
          if (key == 13){
          	displayDirections(form)
          }
     }
    }

    else {
      alert("Sorry, the Google Maps API is not compatible with this browser");
    }

    //]]>
    </script>
  </body>
